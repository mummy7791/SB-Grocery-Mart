<!DOCTYPE html>
<html>
<head>
  <title>Customer Login - SB Grocery Mart</title>
</head>

<body>

<h2>SB Grocery Mart Login</h2>

<input id="name" placeholder="Full Name"><br><br>
<input id="phone" placeholder="Phone Number"><br><br>
<input id="email" placeholder="Email"><br><br>
<textarea id="address" placeholder="Delivery Address"></textarea><br><br>

<button onclick="sendOtp()">Send OTP</button>

<div id="otpBox" style="display:none;">
  <input id="otp" placeholder="Enter OTP">
  <button onclick="verifyOtp()">Verify</button>
</div>

<p id="msg"></p>

<script>
const API = "http://localhost:5000";

function sendOtp() {
  fetch(API + "/api/customer/send-otp", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: name.value,
      phone: phone.value,
      email: email.value,
      address: address.value
    })
  })
  .then(res => res.json())
  .then(data => {
    msg.innerText = "OTP: " + data.demoOtp;
    otpBox.style.display = "block";
  });
}

function verifyOtp() {
  fetch(API + "/api/customer/verify-otp", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      phone: phone.value,
      otp: otp.value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.token) {
      localStorage.setItem("customerToken", data.token);
      localStorage.setItem("customer", JSON.stringify(data.customer));
      window.location.href = "index.html";
    } else {
      msg.innerText = data.message;
    }
  });
}
</script>

</body>
</html>
