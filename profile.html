<!DOCTYPE html>
<html>
<head>
  <title>My Profile</title>
</head>
<body>

<h2>My Profile</h2>

<p>Name: <span id="name"></span></p>
<p>Phone: <span id="phone"></span></p>
<p>Email: <span id="email"></span></p>
<p>Address: <span id="address"></span></p>

<button onclick="logout()">Logout</button>

<script>
const API = "http://localhost:5000";
const token = localStorage.getItem("customerToken");

if (!token) {
  window.location.href = "login.html";
}

fetch(API + "/api/customer/profile", {
  headers: {
    Authorization: "Bearer " + token
  }
})
.then(res => res.json())
.then(c => {
  document.getElementById("name").innerText = c.name;
  document.getElementById("phone").innerText = c.phone;
  document.getElementById("email").innerText = c.email;
  document.getElementById("address").innerText = c.address;
});

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
