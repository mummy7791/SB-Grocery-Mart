<!DOCTYPE html>
<html>
<head>
  <title>SB Grocery Mart Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>

<body>

<script>
  if (localStorage.getItem("role") !== "admin") {
    alert("Access Denied ❌");
    window.location.href = "admin-login.html";
  }
</script>

<div class="admin-box">
  <header>
    <h1>⚙️ SB Grocery Mart Admin</h1>

    <nav>
      <button onclick="loadOrders()">📦 Orders</button>
      <button onclick="loadProducts()">🛒 Products</button>
      <a href="customers.html">👥 Customers</a>
      <button onclick="logout()">🚪 Logout</button>
    </nav>
  </header>

  <section class="form-box">
    <h2>Add Product</h2>

    <input id="name" placeholder="Name">
    <input id="category" placeholder="Category">
    <input id="price" type="number" placeholder="Price">
    <input id="image" placeholder="Image URL">

    <button onclick="addProduct()">Add Product</button>
    <h3 id="msg"></h3>
  </section>

  <div id="output" class="grid"></div>
</div>

<script src="./admin.js?v=2"></script>

<script>
function logout() {
  localStorage.removeItem("role");
  localStorage.removeItem("user");
  window.location.href = "admin-login.html";
}
</script>

</body>
</html>
