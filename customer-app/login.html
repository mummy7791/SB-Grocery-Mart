<!DOCTYPE html>
<html>
<head>
  <title>Customer Login - SB Grocery Mart</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">
  <h2>SB Grocery Mart Login</h2>

  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number (+91...)">
  <input id="email" placeholder="Email">
  <textarea id="address" placeholder="Delivery Address"></textarea>

  <button onclick="sendOtp()">Send OTP</button>

  <div id="otpBox" style="display:none;">
    <input id="otp" placeholder="Enter OTP">
    <button onclick="verifyOtp()">Verify & Login</button>
  </div>

  <p id="msg"></p>
</div>

<script>
const API = "http://localhost:5000";

async function sendOtp() {
  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value
  };

  const res = await fetch(API + "/api/customer/send-otp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const result = await res.json();

  document.getElementById("msg").innerText =
    result.demoOtp ? "Demo OTP: " + result.demoOtp : result.message;

  document.getElementById("otpBox").style.display = "block";
}

async function verifyOtp() {
  const data = {
    phone: document.getElementById("phone").value,
    otp: document.getElementById("otp").value
  };

  const res = await fetch(API + "/api/customer/verify-otp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (result.token) {
    localStorage.setItem("customerToken", result.token);
    localStorage.setItem("customer", JSON.stringify(result.customer));

    window.location.href = "index.html"; // store page
  } else {
    document.getElementById("msg").innerText = result.message;
  }
}
</script>

</body>
</html>
