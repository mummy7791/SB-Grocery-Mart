<!DOCTYPE html>
<html>
<head>
  <title>SB Grocery Mart</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a8f3c">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<script>
const token = localStorage.getItem("customerToken");
if (!token) window.location.href = "login.html";
</script>

<header class="topbar">
  <div>
    <h1>SB Grocery Mart</h1>
    <p>Delivery in <b>10 minutes</b></p>
  </div>

  <div class="location" onclick="getUserLocation()">
    📍 <span id="locationText">Detecting location...</span>
  </div>

  <input id="searchInput" oninput="searchProducts()" placeholder='Search "milk", "rice", "snacks"...'>

  <button onclick="viewCart()">🛒 Cart <span id="cartCount">0</span></button>
  <button onclick="trackOrders()">📦 Orders</button>
  <button onclick="logout()">Logout</button>
</header>

<section class="banner">
  <h2>Fresh groceries delivered fast</h2>
  <p>Daily essentials, fruits, snacks, dairy and more</p>
</section>

<section class="categories">
  <div onclick="loadProducts()">🏪<br>All</div>
  <div onclick="filterCategory('Dairy')">🥛<br>Dairy</div>
  <div onclick="filterCategory('Fruits')">🍎<br>Fruits</div>
  <div onclick="filterCategory('Drinks')">🥤<br>Drinks</div>
  <div onclick="filterCategory('Snacks')">🍪<br>Snacks</div>
  <div onclick="filterCategory('Rice')">🍚<br>Rice</div>
  <div onclick="filterCategory('Cleaning')">🧼<br>Cleaning</div>
</section>

<h2 class="title">Daily Essentials</h2>

<div id="products" class="products">
  Loading products...
</div>

<script src="./app.js?v=3000"></script>
</body>
</html>
